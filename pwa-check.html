<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWA Install Check</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:20px auto;padding:20px;line-height:1.6}
.check{padding:10px;border-radius:6px;margin:8px 0}
.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.fail{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.pending{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}
button{padding:10px 20px;background:#1e40af;color:white;border:none;border-radius:6px;cursor:pointer;margin:5px 0}
button:hover{background:#1e3a8a}
pre{background:#f4f4f5;padding:10px;border-radius:4px;overflow-x:auto;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>PWA Install Check</h1>
<div id="results"></div>
<button onclick="checkInstallability()">Check Install Status</button>
<button onclick="tryInstall()">Try Install</button>
<pre id="log"></pre>

<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  log('✓ beforeinstallprompt event fired — install is possible');
  document.getElementById('installBtn').disabled = false;
});

window.addEventListener('appinstalled', () => {
  log('✓ App installed successfully!');
  deferredPrompt = null;
});

function log(msg){
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
}

async function checkInstallability(){
  document.getElementById('log').textContent = '';
  const results = document.getElementById('results');
  results.innerHTML = '';

  // 1. HTTPS check
  if(location.protocol === 'https:'){
    addCheck(results, 'ok', '✓ HTTPS চালু');
  }else{
    addCheck(results, 'fail', '✗ HTTPS চালু নয় — PWA এর জন্য দরকার');
  }

  // 2. Manifest check
  try{
    const manifest = await fetch('/manifest-meal-summary.json').then(r => r.json());
    addCheck(results, 'ok', '✓ Manifest লোড হয়েছে');
    log('Manifest:', JSON.stringify(manifest, null, 2));
    if(!manifest.name) addCheck(results, 'fail', '✗ Manifest এ name নেই');
    if(!manifest.start_url) addCheck(results, 'fail', '✗ Manifest এ start_url নেই');
    if(!manifest.icons || manifest.icons.length === 0) addCheck(results, 'fail', '✗ Manifest এ icons নেই');
  }catch(e){
    addCheck(results, 'fail', '✗ Manifest লোড ব্যর্থ: ' + e.message);
  }

  // 3. Service Worker check
  if('serviceWorker' in navigator){
    addCheck(results, 'ok', '✓ Service Worker supported');
    try{
      const regs = await navigator.serviceWorker.getRegistrations();
      if(regs.length > 0){
        addCheck(results, 'ok', '✓ Service Worker registered (' + regs.length + ')');
        regs.forEach(r => log('SW scope:', r.scope, 'active:', r.active?.state));
      }else{
        addCheck(results, 'fail', '✗ Service Worker registered নয় — নিচে register বাটন চাপুন');
      }
    }catch(e){
      addCheck(results, 'fail', '✗ SW check error: ' + e.message);
    }
  }else{
    addCheck(results, 'fail', '✗ Service Worker supported নয় এই ব্রাউজারে');
  }

  // 4. beforeinstallprompt check
  if(deferredPrompt){
    addCheck(results, 'ok', '✓ beforeinstallprompt ইভেন্ট fired — install সম্ভব');
  }else{
    addCheck(results, 'pending', '⏳ beforeinstallprompt এখনও fired হয়নি — পেজ reload করে চেক করুন');
  }

  // 5. Display mode check
  if(window.matchMedia('(display-mode: standalone)').matches){
    addCheck(results, 'ok', '✓ অ্যাপ ইতিমধ্যে installed (standalone mode)');
  }else{
    addCheck(results, 'pending', '⏳ অ্যাপ installed নয় (browser mode)');
  }
}

function tryInstall(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choice) => {
      log('User choice:', choice.outcome);
      deferredPrompt = null;
    });
  }else{
    alert('Install সম্ভব নয়। নিচের স্টেপগুলো চেক করুন:\n\n1. Chrome মেনু (⋮) → Add to Home screen\n2. যদি না আসে — পেজ reload করুন\n3. এখানে আবার চেষ্টা করুন');
  }
}

async function registerSW(){
  try{
    const reg = await navigator.serviceWorker.register('/sw-meal-summary.js', {scope: '/'});
    log('✓ SW registered:', reg.scope);
    addCheck(document.getElementById('results'), 'ok', '✓ Service Worker registered!');
  }catch(e){
    log('✗ SW registration failed:', e.message);
    addCheck(document.getElementById('results'), 'fail', '✗ SW registration failed: ' + e.message);
  }
}

function addCheck(container, type, msg){
  const div = document.createElement('div');
  div.className = 'check ' + type;
  div.textContent = msg;
  container.appendChild(div);
}

// Auto-check on load
checkInstallability();
</script>
</body>
</html>
